services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: /home/runner/work/daily-vault/daily-vault/server
      target: development
    env_file:
      - /home/runner/work/daily-vault/daily-vault/.env.example
    environment:
      MONGODB_URI: mongodb://host.docker.internal:27017/daily-vault
      CLIENT_URL: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - mongo
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '4000:4000'

  client:
    build:
      context: /home/runner/work/daily-vault/daily-vault/client
      target: development
    depends_on:
      - server
    environment:
      VITE_API_BASE_URL: /api
      VITE_SOCKET_PATH: /socket.io
      VITE_DEV_PROXY_TARGET: http://host.docker.internal:4000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '5173:5173'

volumes:
  mongo_data:
